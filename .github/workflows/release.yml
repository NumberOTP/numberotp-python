name: release

# Publishes to PyPI with trusted publishing (OIDC): no API token is stored
# anywhere; PyPI trusts this repository and this workflow file.
# Release: bump the version in pyproject.toml and numberotp/_core.py, then
# push a tag `v<version>`.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Tag matches the package version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "$want" = "$have" || { echo "tag $want != pyproject $have"; exit 1; }
      - run: pip install build -e '.[dev]'
      - run: pytest -q
      - run: python -m build --outdir dist
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
